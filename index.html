<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>FRAGENTRE — Authentic Perfume Decants</title>
<meta name="description" content="Authentic perfume decants with nationwide delivery across Bangladesh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --paper:#FAF9F7;
  --soft:#F4F2EE;
  --line:#E8E5DF;
  --tx:#141414;
  --mut:#6E6B64;
  --gold:#9A7632
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  max-width:100%;
  overflow-x:hidden
}
button,input,a{font:inherit;color:inherit}
a{text-decoration:none}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

.wrap{width:100%;max-width:480px;margin:0 auto;padding:0 16px}

/* Glass Sticky Top Bar */
header.glass-hdr{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.76);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  border-bottom:1px solid rgba(20,20,20,.08);
  padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:42px
}
.icon-btn{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:999px;
  transition:background .2s
}
.icon-btn:hover{background:rgba(20,20,20,.05)}
.icon-btn svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top-bag{position:relative}
.top-bag i{
  position:absolute;top:2px;right:1px;
  min-width:17px;height:17px;border-radius:9px;
  background:var(--tx);color:#FFFFFF;
  font-style:normal;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px
}

.wordmark{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:18px;
  font-weight:500;
  letter-spacing:.26em;
  text-indent:.26em;
  text-transform:uppercase;
  color:var(--tx);
  text-align:center
}

/* Search & Brand Filter */
.tools{padding:16px 0 6px}
.search{position:relative}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:#8A8780
}
.search input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 14px 12px 42px;
  font-size:15px;
  color:var(--tx);
  outline:none;
  transition:border-color .2s
}
.search input:focus{border-color:var(--tx)}
.search input::placeholder{color:#9B978E}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{
  padding:8px 15px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--bg);
  font-size:12.5px;
  color:var(--mut);
  transition:.2s
}
.pill.on{
  background:var(--tx);
  border-color:var(--tx);
  color:#FFFFFF;
  font-weight:600
}

/* Catalog Cards */
#collection{margin-top:14px}
.card{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:18px;
  cursor:pointer;
  transition:border-color .2s
}
.card:hover{border-color:#C9C5BC}
.img{
  height:245px;
  padding:18px;
  display:flex;align-items:center;justify-content:center;
  background:#FFFFFF;
  border-bottom:1px solid var(--line);
  position:relative;
  overflow:hidden
}
.img img{
  width:auto;height:auto;
  max-width:78%;max-height:84%;
  object-fit:contain
}
.img .ph{
  display:none;flex-direction:column;align-items:center;gap:8px;
  color:var(--mut);font-size:11px;letter-spacing:.18em;text-transform:uppercase
}
.img.noimg .ph{display:flex}
.img.noimg img{display:none}

.body{padding:18px}
.brand{
  font-size:10.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--mut);
  font-weight:600
}
.title{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:21px;
  font-weight:500;
  line-height:1.25;
  margin-top:4px;
  color:var(--tx)
}
.vibe{font-size:13px;color:var(--mut);margin-top:5px}
.fr{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)
}
.fr small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.fr b{font-size:20px;font-weight:600;color:var(--tx)}
.vd{
  border:1px solid var(--tx);
  color:var(--tx);
  border-radius:6px;
  padding:10px 16px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  transition:.2s
}
.vd:hover{background:var(--tx);color:#FFFFFF}

/* Request Box on Home */
.suggest{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 18px;
  margin-top:14px
}
.suggest h3{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:17px;
  font-weight:500;
  letter-spacing:.06em;
  text-transform:uppercase
}
.suggest p{font-size:13px;color:var(--mut);margin:6px 0 12px}
.suggest input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
  font-size:15px;
  color:var(--tx);
  outline:none
}
.suggest input:focus{border-color:var(--tx)}
.suggest button{
  width:100%;
  margin-top:10px;
  height:46px;
  background:var(--tx);
  color:#FFFFFF;
  border-radius:6px;
  font-weight:600;
  letter-spacing:.14em;
  font-size:12px;
  text-transform:uppercase
}

/* Footer */
footer{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--line)
}
.f-links{
  display:flex;
  flex-wrap:wrap;
  gap:10px 18px;
  margin-top:12px;
  font-size:12.5px;
  color:var(--mut)
}
.f-links button{color:var(--mut);padding:2px 0}
.f-links button:hover{color:var(--tx)}
.f-bot{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
  text-align:center;
  font-size:11px;
  color:#8E8A82;
  letter-spacing:.08em
}

/* Separate Page View (Pick-up points, Delivery policy, About) */
.page-view{
  position:fixed;
  inset:0;
  z-index:48;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s
}
.page-view.show{
  transform:none;
  visibility:visible;
  transition:transform .3s cubic-bezier(.2,.8,.2,1)
}
.pv-head{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}
.pv-back{
  display:flex;align-items:center;gap:4px;height:38px;padding:0 8px;
  font-size:13.5px;font-weight:500;color:var(--tx)
}
.pv-back svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pv-title{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase
}
.pv-body{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:22px 16px calc(36px + env(safe-area-inset-bottom,0px))
}
.pv-card{
  max-width:480px;
  margin:0 auto;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  padding:20px 18px
}
.pv-kicker{
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:600
}
.pv-card h2{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:20px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-top:6px
}
.pv-card p{
  font-size:13.5px;color:var(--mut);margin-top:10px;line-height:1.65
}
.pickup-list{
  list-style:none;
  margin-top:16px;
  border-top:1px solid var(--line)
}
.pickup-list li{
  padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;font-weight:500;color:var(--tx)
}
.pickup-list li small{
  display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:2px
}

/* Sticky Bag Bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  transform:translateY(110%);
  transition:transform .3s
}
.bar.show{transform:none}
.bar .in{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar small{display:block;font-size:12px;color:var(--mut)}
.bar b{font-size:18px}
.bar button{
  background:var(--tx);color:#FFFFFF;
  font-weight:600;border-radius:6px;padding:12px 20px;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase
}

/* Overlay & Slide-Out Drawer */
.ov{
  position:fixed;inset:0;
  background:rgba(20,20,20,.42);
  z-index:60;opacity:0;pointer-events:none;transition:opacity .26s
}
.ov.show{opacity:1;pointer-events:auto}

.nav-drawer{
  position:fixed;top:0;bottom:0;left:0;
  width:min(340px,88vw);
  z-index:75;
  background:var(--bg);
  border-right:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;
  transform:translateX(-105%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1)
}
.nav-drawer.show{transform:none}
.nav-top{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px
}
.close-circle{
  width:42px;height:42px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--tx)
}
.menu-label{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--mut);
  font-weight:600
}
.nav-list{
  list-style:none;
  margin-top:12px;
  border-top:1px solid var(--line)
}
.nav-list li{
  border-bottom:1px solid var(--line)
}
.nav-list button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 2px;
  font-size:13.5px;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--tx);
  text-align:left
}
.nav-list button span:last-child{
  color:var(--mut);
  font-size:16px;
  letter-spacing:0
}
.nav-list button:hover{color:var(--gold)}

/* Bag Drawer */
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--bg);
  border-radius:16px 16px 0 0;
  border-top:1px solid var(--line);
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(105%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  max-width:480px;margin:0 auto;
  box-shadow:0 -10px 30px rgba(20,20,20,.1)
}
.drawer.show{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dh h3{font-family:'Montserrat','Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.dh button{font-size:26px;color:var(--mut);width:36px;height:36px;line-height:1}
.items{overflow-y:auto;padding:0 18px;flex:1}
.it{padding:14px 0;border-bottom:1px solid var(--line)}
.it .t{display:flex;justify-content:space-between;gap:10px}
.it .t b{font-size:15px}
.it .t span{color:var(--tx);font-weight:700;white-space:nowrap}
.it small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.it .c{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--paper);flex:none}
.qty button{width:34px;height:36px;font-size:18px;color:var(--tx)}
.qty span{min-width:26px;text-align:center;font-weight:600;font-size:14px}
.rm{font-size:12px;color:var(--mut);text-decoration:underline}

.dl{padding:14px 18px 6px}
.opt{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--tx);background:var(--paper);
  border-radius:8px;padding:12px;margin-top:8px;font-size:13.5px;font-weight:500
}
.opt input{accent-color:var(--tx);width:17px;height:17px}
.opt span{flex:1}

.tot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 2px;font-size:13px;color:var(--mut)}
.tot.g{font-size:18px;color:var(--tx);font-weight:700;padding-top:10px}
.co{
  margin:14px 18px calc(18px + env(safe-area-inset-bottom,0px));
  height:48px;background:var(--tx);color:#FFFFFF;
  border-radius:6px;font-weight:600;letter-spacing:.14em;font-size:12px;
  text-transform:uppercase;width:calc(100% - 36px)
}
.noitem{text-align:center;color:var(--mut);padding:40px 0;font-size:14px}

/* Detail View */
.dv{
  position:fixed;top:0;bottom:0;left:0;right:0;
  max-width:480px;margin:0 auto;z-index:50;
  background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s
}
.dv.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.dtop{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}
.back,.bagbtn{
  display:flex;align-items:center;gap:4px;height:40px;padding:0 10px;
  color:var(--tx);font-size:14px;position:relative
}
.back svg,.bagbtn svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbrand{
  font-family:'Montserrat','Plus Jakarta Sans',sans-serif;
  font-size:13px;letter-spacing:.24em;text-indent:.24em;font-weight:500;text-transform:uppercase
}
.bagbtn i{
  position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;
  background:var(--tx);color:#FFFFFF;font-style:normal;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px
}
.dsc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dsc .img{height:280px;padding:20px}
.pr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.price{font-size:26px;font-weight:700;color:var(--tx)}
.badge{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--tx);font-size:12px;font-weight:500}
.lbl{font-size:10.5px;letter-spacing:.2em;color:var(--mut);margin:18px 0 10px;font-weight:700}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{
  border:1px solid var(--line);border-radius:8px;padding:12px 10px;
  text-align:center;background:var(--paper);transition:.2s
}
.size b{display:block;font-size:14px;letter-spacing:.12em;font-weight:700}
.size span{display:block;font-size:15px;margin-top:2px}
.size small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.size.on{border-color:var(--tx);background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--tx)}
.row{display:flex;gap:10px;margin-top:18px}
.row .qty button{height:48px;width:40px}
.add{
  flex:1;background:var(--tx);color:#FFFFFF;border-radius:6px;
  font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase;height:48px;transition:.2s
}
.add.done{background:var(--gold);color:#FFFFFF}
.wa{
  width:100%;margin-top:10px;height:46px;
  border:1px solid var(--line);background:var(--bg);border-radius:6px;
  font-size:13.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px
}
.wa:hover{border-color:var(--tx)}
.wa svg{width:17px;height:17px;fill:var(--tx)}
.trust{list-style:none;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.trust li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--mut);line-height:1.45}
.trust svg{flex:none;width:18px;height:18px;stroke:var(--tx);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.empty{text-align:center;color:var(--mut);padding:36px 10px;font-size:14px}

.sec{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.sec .lbl{margin:0 0 12px}
.tier{margin-left:5px;padding:0 0 14px 16px;border-left:1px solid var(--line);position:relative}
.tier:last-child{padding-bottom:0}
.tier::before{content:"";position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--tx)}
.tier h5{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.18em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.tag{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#FFFFFF;color:var(--tx);font-weight:500}
.desc{font-size:14px;color:#3E3C37;line-height:1.65}
.dbar{
  flex:none;display:flex;align-items:center;gap:14px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line)
}
.dbar>div{flex:1;min-width:0}
.dbar small{display:block;font-size:12px;color:var(--mut)}
.dbar b{font-size:20px}
.dbar .add{flex:none;width:155px}

@media (prefers-reduced-motion:reduce){
  .dv,.drawer,.nav-drawer,.bar,.page-view{transition:none}
}
</style>
</head>
<body>

<header class="glass-hdr" id="home">
  <div class="wrap">
    <div class="topbar">
      <button class="icon-btn" id="menuOpen" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="wordmark">FRAGENTRE</div>
      <button class="icon-btn top-bag" id="topBag" type="button" aria-label="Open shopping bag">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg>
        <i id="tbc" style="display:none">0</i>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search perfume or brand..." autocomplete="off" aria-label="Search perfume or brand">
    </div>
    <div class="pills" id="pills"></div>
  </div>

  <div id="collection">

</main>

<!-- Separate Screen for Pick-up points, Delivery policy, and About -->
<section class="page-view" id="pv" role="dialog" aria-modal="true" aria-label="Information page" aria-hidden="true">

    </button>
    <span class="pv-title" id="pvTitle">FRAGENTRE</span>
    <span style="width:52px" aria-hidden="true"></span>
  </div>
  <div class="pv-body" id="pvBody"></div>
</section>

<div class="bar" id="bar">
  <div class="in">
    <div><small id="bc">0 items</small><b id="bs">৳0</b></div>
    <button id="vb" type="button">View Bag</button>
  </div>
</div>

<div class="ov" id="ov"></div>

<nav class="nav-drawer" id="navDrawer" aria-label="Main navigation" aria-hidden="true">

    <li><button type="button" data-page="pickups"><span>Pick-up points</span><span>›</span></button></li>

  <div class="dl">
    <div class="lbl" style="margin:0 0 4px">DELIVERY</div>
    <label class="opt" id="o120"><input type="radio" name="d" value="120" checked><span>Nationwide Delivery</span><b>৳120</b></label>
  </div>

    <button class="bagbtn" type="button" data-a="bag" aria-label="Open bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg><i id="dbc" style="display:none">0</i></button>
  </div>

<script>
(function(){
var PHONE="8801841928296";
var DELIVERY=120;
var SIZES=[5,10,15,30];
var WEARS={5:"15+ wears",10:"30+ wears",15:"45+ wears",30:"90+ wears"};
var SPRAYS={5:"75+ sprays",10:"150+ sprays",15:"225+ sprays",30:"450+ sprays"};
var P=[
 {id:"hawas-ice",brand:"Rasasi",name:"Hawas Ice",img:"images/hawas-ice.png.WEBP",pr:{5:320,10:580,15:800,30:1420},vibe:"Fresh, fruity, icy",top:["Frozen Apple","Italian Bergamot","Italian Lemon","Star Anise"],heart:["Orange Blossom","Plum","Cardamom"],base:["Moss","Driftwood","Amber","Musk"],seasons:["Spring","Summer"],occ:["Daily wear","Office","Casual outings"],desc:"A cool, crisp scent that opens with frosty apple and bright citrus, softens into plum and orange blossom, and dries down to a clean base of moss, amber and musk."},
 {id:"rayhaan-aquatica",brand:"Rayhaan",name:"Rayhaan Aquatica",img:"images/rayhaan-aquatica.png.WEBP",pr:{5:270,10:470,15:660,30:1200},vibe:"Tropical, citrusy, coconut",top:["Lime","Coconut Milk","Bergamot","Mandarin"],heart:["Sugar Cane","Jasmine","Hibiscus","Gardenia"],base:["Rum","Musk","Tonka Bean","Patchouli"],seasons:["Spring","Summer"],occ:["Daytime","Casual outings","Beach days"],desc:"Sun-warmed tropical citrus with creamy coconut milk, resting on a sweet, boozy base of rum, tonka bean and musk. Light, fresh and made for warm days."},
 {id:"liquid-brun",brand:"French Avenue",name:"Liquid Brun",img:"images/liquid-brun.png.WEBP",pr:{5:350,10:650,15:900,30:1700},vibe:"Sweet, spicy, gourmand",top:["Cinnamon","Orange Blossom","Cardamom","Bergamot"],heart:["Bourbon Vanilla","Elemi"],base:["Praline","Ambroxan","Musk","Guaiac Wood"],seasons:["Autumn","Winter"],occ:["Evenings","Date nights","Celebrations"],desc:"A rich, warm gourmand. Cinnamon and cardamom open the scent, bourbon vanilla gives it a creamy heart, and sweet praline settles over smooth woods and musk."}
];
var PAGES={
 pickups:{
  bar:"PICK-UP POINTS",
  kicker:"Collection",
  heading:"Pick-up points",
  text:"Scheduled in-person collection is available by prior confirmation at these locations:",
  spots:["Trunk Road","Taranibash","Appayon Tower, Feni"]
 },
 delivery:{
  bar:"DELIVERY POLICY",
  kicker:"Shipping",
  heading:"Delivery policy",
  text:"Orders ship nationwide across Bangladesh (৳120) with Cash on Delivery. Every glass decant atomizer is packed with protective cushioning—please inspect your parcel on arrival and record an unboxing video if any issue occurs in transit."
 },
 about:{
  bar:"ABOUT",
  kicker:"Brand",
  heading:"About FRAGENTRE",
  text:"FRAGENTRE makes authentic designer and Middle Eastern fragrances accessible in travel-ready glass atomizers. Every decant is hand-drawn carefully from sealed original bottles so you can experience real projection, longevity, and wearability on your skin before committing to a full bottle."
 }
};
var BRANDS=["All","Rasasi","Rayhaan","French Avenue"];
var st={}; P.forEach(function(p){st[p.id]={size:5,qty:1}});
var cart=[],brand="All",term="";
var curPage=null,curId=null;
var $=function(i){return document.getElementById(i)};
var tk=function(n){return "৳"+n.toLocaleString("en-US")};
var find=function(id){return P.filter(function(p){return p.id===id})[0]};

var IC={
 cod:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></svg>',
 truck:'<svg viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 9h4.5l3.5 3.5V16h-8"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
 shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>'
};
var WAI='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.8 1.2 2.1 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>';

function PH(p){return '<div class="ph"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6E6B64" stroke-width="1.2"><rect x="7" y="9" width="10" height="12" rx="2"/><path d="M10 9V6h4v3M9 3h6v3H9z"/></svg>'+p.name+'</div>'}
function IMG(p){return '<div class="img"><img src="'+p.img+'" alt="'+p.name+' by '+p.brand+'" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\')">'+PH(p)+'</div>'}
function chips(a,c){return a.map(function(n){return '<span class="'+(c||'chip')+'">'+n+'</span>'}).join("")}

function card(p){
 return '<article class="card" data-a="open" data-id="'+p.id+'">'+IMG(p)+
  '<div class="body"><div class="brand">'+p.brand+'</div><h2 class="title">'+p.name+'</h2><p class="vibe">'+p.vibe+'</p>'+
  '<div class="fr"><div><small>From</small><b>'+tk(p.pr[5])+'</b></div><button class="vd" type="button" data-a="open" data-id="'+p.id+'">View Details</button></div></div></article>';
}
function renderList(){
 var t=term.trim().toLowerCase();
 var arr=P.filter(function(p){
  return (brand==="All"||p.brand===brand)&&(!t||(p.name+" "+p.brand).toLowerCase().indexOf(t)>-1);
 });
 $("list").innerHTML=arr.length?arr.map(card).join(""):'<div class="empty">No perfumes match your search. Try another name or brand, or request it below.</div>';
}

function detail(p){
 var s=st[p.id],pr=p.pr[s.size];
 var tiles=SIZES.map(function(z){
  return '<button class="size'+(z===s.size?' on':'')+'" type="button" data-a="size" data-id="'+p.id+'" data-v="'+z+'" aria-pressed="'+(z===s.size)+'"><b>'+z+'ML</b><span>'+tk(p.pr[z])+'</span><small>'+SPRAYS[z]+'</small></button>';
 }).join("");
 return IMG(p)+'<div class="body"><div class="brand">'+p.brand+'</div><h2 class="title">'+p.name+'</h2>'+
  '<div class="pr"><div class="price">'+tk(pr)+'</div><span class="badge">'+WEARS[s.size]+'</span></div>'+
  '<div class="lbl">SELECT SIZE</div><div class="sizes">'+tiles+'</div>'+
  '<div class="row"><div class="qty"><button type="button" data-a="qm" data-id="'+p.id+'" aria-label="Decrease quantity">−</button><span>'+s.qty+'</span><button type="button" data-a="qp" data-id="'+p.id+'" aria-label="Increase quantity">+</button></div>'+
  '<button class="add" type="button" data-a="add" data-id="'+p.id+'">ADD TO BAG</button></div>'+
  '<button class="wa" type="button" data-a="wa" data-id="'+p.id+'">'+WAI+'Quick Order on WhatsApp</button>'+
  '<div class="sec"><div class="lbl">FRAGRANCE PYRAMID</div>'+
   '<div class="tier"><h5>TOP NOTES</h5><div class="chips">'+chips(p.top)+'</div></div>'+
   '<div class="tier"><h5>HEART NOTES</h5><div class="chips">'+chips(p.heart)+'</div></div>'+
   '<div class="tier"><h5>BASE NOTES</h5><div class="chips">'+chips(p.base)+'</div></div></div>'+
  '<div class="sec"><div class="lbl">BEST SEASONS</div><div class="chips">'+chips(p.seasons,"tag")+'</div>'+
   '<div class="lbl" style="margin-top:18px">BEST OCCASIONS</div><div class="chips">'+chips(p.occ,"tag")+'</div></div>'+
  '<div class="sec"><div class="lbl">ABOUT</div><p class="desc">'+p.desc+'</p></div>'+
  '<ul class="trust"><li>'+IC.cod+'<span>Cash on delivery available across Bangladesh</span></li><li>'+IC.truck+'<span>Nationwide delivery via Steadfast Courier</span></li><li>'+IC.shield+'<span>100% genuine, hand-decanted from sealed original bottles</span></li></ul></div>';
}
function dbar(p){
 var s=st[p.id];
 return '<div><small>'+s.size+'ML'+(s.qty>1?' × '+s.qty:'')+'</small><b>'+tk(p.pr[s.size]*s.qty)+'</b></div><button class="add" type="button" data-a="add" data-id="'+p.id+'">ADD TO BAG</button>';
}
function lock(){
 var navOpen=$("navDrawer").classList.contains("show");
 var bagOpen=$("dr").classList.contains("show");
 document.body.style.overflow=(curId||curPage||navOpen||bagOpen)?"hidden":"";
}
function renderDetail(){
 var p=find(curId),sc=$("dsc"),y=sc.scrollTop;
 sc.innerHTML=detail(p);$("dbar").innerHTML=dbar(p);sc.scrollTop=y;
}
function openDetail(id,nopush){
 curId=id;renderDetail();$("dsc").scrollTop=0;
 $("dv").classList.add("show");$("dv").setAttribute("aria-hidden","false");lock();
 if(!nopush){try{history.pushState({d:1},"","#"+id)}catch(e){}}
 $("dback").focus({preventScroll:true});
}
function closeDetail(fromPop){
 if(!curId)return;
 curId=null;$("dv").classList.remove("show");$("dv").setAttribute("aria-hidden","true");lock();
 if(!fromPop&&history.state&&history.state.d){try{history.back()}catch(e){}}
}

function openPage(key){
 openNav(false);
 if(key==="home"){
  closePage();
  window.scrollTo({top:0,behavior:"smooth"});
  return;
 }
 var pg=PAGES[key];
 if(!pg)return;
 curPage=key;
 $("pvTitle").textContent=pg.bar;
 var spotsHtml=pg.spots?('<ul class="pickup-list">'+pg.spots.map(function(s){return '<li>'+s+'<small>By prior confirmation</small></li>'}).join("")+'</ul>'):"";
 $("pvBody").innerHTML='<div class="pv-card"><div class="pv-kicker">'+pg.kicker+'</div><h2>'+pg.heading+'</h2><p>'+pg.text+'</p>'+spotsHtml+'</div>';
 $("pvBody").scrollTop=0;
 $("pv").classList.add("show");
 $("pv").setAttribute("aria-hidden","false");
 lock();
 $("pvBack").focus({preventScroll:true});
}
function closePage(){
 if(!curPage)return;
 curPage=null;
 $("pv").classList.remove("show");
 $("pv").setAttribute("aria-hidden","true");
 lock();
}

function renderPills(){
 $("pills").innerHTML=BRANDS.map(function(b){return '<button class="pill'+(b===brand?' on':'')+'" type="button" data-a="brand" data-v="'+b+'">'+b+'</button>'}).join("");
}

function sub(){return cart.reduce(function(a,i){return a+find(i.id).pr[i.size]*i.qty},0)}
function count(){return cart.reduce(function(a,i){return a+i.qty},0)}
function renderBag(){
 var n=count(),s=sub();
 $("bar").classList.toggle("show",n>0);
 $("bc").textContent=n+(n===1?" item":" items");
 $("bs").textContent=tk(s);
 $("dbc").textContent=n;$("dbc").style.display=n?"":"none";
 $("tbc").textContent=n;$("tbc").style.display=n?"":"none";
 $("items").innerHTML=cart.length?cart.map(function(i,ix){
  var p=find(i.id),u=p.pr[i.size];
  return '<div class="it"><div class="t"><b>'+p.name+'</b><span>'+tk(u*i.qty)+'</span></div><small>'+p.brand+' • '+i.size+'ml • '+tk(u)+' each</small>'+
  '<div class="c"><div class="qty"><button type="button" data-a="cm" data-v="'+ix+'" aria-label="Decrease">−</button><span>'+i.qty+'</span><button type="button" data-a="cp" data-v="'+ix+'" aria-label="Increase">+</button></div><button class="rm" type="button" data-a="rm" data-v="'+ix+'">Remove</button></div></div>';
 }).join(""):'<div class="noitem">Your bag is empty.</div>';
 $("ds").textContent=tk(s);
 $("dd").textContent=tk(DELIVERY);
 $("dt").textContent=tk(s+(cart.length?DELIVERY:0));
 $("co").disabled=!cart.length;$("co").style.opacity=cart.length?1:.4;
 if(!cart.length&&$("dr").classList.contains("show"))setTimeout(function(){if(!cart.length)openDrawer(false)},500);
}
function openDrawer(o){
 if(o)openNav(false);
 $("dr").classList.toggle("show",o);
 $("dr").setAttribute("aria-hidden",!o);
 syncOverlay();lock();
}
function openNav(o){
 if(o)openDrawer(false);
 $("navDrawer").classList.toggle("show",o);
 $("navDrawer").setAttribute("aria-hidden",!o);
 syncOverlay();lock();
}
function syncOverlay(){
 var any=$("dr").classList.contains("show")||$("navDrawer").classList.contains("show");
 $("ov").classList.toggle("show",any);
}
function wa(msg){window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg),"_blank","noopener")}

document.addEventListener("click",function(e){
 var pgBtn=e.target.closest("[data-page]");
 if(pgBtn){openPage(pgBtn.dataset.page);return;}

 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=b.dataset.id,v=b.dataset.v,s;
 if(a==="brand"){brand=v;renderPills();renderList();}
 else if(a==="open"){openDetail(id);}
 else if(a==="back"){closeDetail();}
 else if(a==="bag"){openDrawer(true);}
 else if(a==="size"){st[id].size=+v;renderDetail();}
 else if(a==="qp"){st[id].qty=Math.min(20,st[id].qty+1);renderDetail();}
 else if(a==="qm"){st[id].qty=Math.max(1,st[id].qty-1);renderDetail();}
 else if(a==="add"){
  s=st[id];
  var ex=cart.filter(function(i){return i.id===id&&i.size===s.size})[0];
  if(ex)ex.qty=Math.min(50,ex.qty+s.qty);else cart.push({id:id,size:s.size,qty:s.qty});
  renderBag();
  b.textContent="Added ✓";b.classList.add("done");
  setTimeout(function(){b.textContent="ADD TO BAG";b.classList.remove("done");},1300);
 }
 else if(a==="wa"){
  s=st[id];var p=find(id),u=p.pr[s.size];
  wa("Hello FRAGENTRE! I'd like to order:\n\n• "+p.name+" ("+p.brand+")\n• Size: "+s.size+"ml\n• Quantity: "+s.qty+"\n• Price: "+tk(u*s.qty)+"\n\nPlease confirm availability and delivery details. Thank you!");
 }
 else if(a==="cp"){cart[+v].qty=Math.min(50,cart[+v].qty+1);renderBag();}
 else if(a==="cm"){cart[+v].qty=Math.max(1,cart[+v].qty-1);renderBag();}
 else if(a==="rm"){cart.splice(+v,1);renderBag();}
});
$("q").addEventListener("input",function(e){term=e.target.value;renderList()});
$("menuOpen").addEventListener("click",function(){openNav(true)});
$("menuClose").addEventListener("click",function(){openNav(false)});
$("pvBack").addEventListener("click",function(){closePage()});
$("topBag").addEventListener("click",function(){openDrawer(true)});
$("vb").addEventListener("click",function(){openDrawer(true)});
$("cl").addEventListener("click",function(){openDrawer(false)});
$("ov").addEventListener("click",function(){openNav(false);openDrawer(false)});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"){
  if($("navDrawer").classList.contains("show"))openNav(false);
  else if($("dr").classList.contains("show"))openDrawer(false);
  else if(curId)closeDetail();
  else if(curPage)closePage();
 }
});
$("co").addEventListener("click",function(){
 if(!cart.length)return;
 var s=sub();
 var lines=cart.map(function(i,n){
  var p=find(i.id),u=p.pr[i.size];
  return (n+1)+". "+p.name+" ("+p.brand+")\n   "+i.size+"ml × "+i.qty+" = "+tk(u*i.qty);
 }).join("\n");
 wa("Hello FRAGENTRE! I'd like to place an order:\n\n"+lines+"\n\nSubtotal: "+tk(s)+"\nNationwide Delivery: "+tk(DELIVERY)+"\nTotal: "+tk(s+DELIVERY)+"\n\nPayment: Cash on delivery\nName:\nPhone:\nFull address:\n\nThank you!");
});
$("sgb").addEventListener("click",function(){
 var v=$("sg").value.trim();
 if(!v){$("sg").focus();$("sg").placeholder="Type a perfume name first";return;}
 wa("Hello FRAGENTRE! Stock request: I'd love to see \""+v+"\" available as a decant. Please let me know if you can bring it in. Thank you!");
});

renderPills();renderList();renderBag();
window.addEventListener("popstate",function(){closeDetail(true)});
var h0=location.hash.slice(1);if(h0&&find(h0))openDetail(h0,true);
})();
</script>
</body>
</html>
