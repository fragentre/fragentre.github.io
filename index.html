<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F6">
<title>FRAGENTRE — Authentic Perfume Decants</title>
<meta name="description" content="Authentic perfume decants with nationwide delivery across Bangladesh and local pick-up in Feni.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6;
  --card:#FFFFFF;
  --soft:#F2EFE9;
  --line:#E5E0D5;
  --ink:#141414;
  --mut:#66625B;
  --gold:#9E7B34;
  --gold-soft:rgba(158,123,52,.11);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  line-height:1.55;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  max-width:100%;
  overflow-x:hidden;
}
button,input,a{font:inherit;color:inherit}
a{text-decoration:none}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:0 16px}

/* Topbar & Header */
header{
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 22px;
  scroll-margin-top:0;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  min-height:40px;
}
.menu-btn{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card);
  transition:border-color .2s,background .2s;
}
.menu-btn:hover{border-color:var(--gold);background:var(--soft)}
.menu-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.top-bag{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card);
  position:relative;
  transition:border-color .2s,background .2s;
}
.top-bag:hover{border-color:var(--gold);background:var(--soft)}
.top-bag svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top-bag i{
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:18px;
  height:18px;
  border-radius:999px;
  background:var(--ink);
  color:#FFFFFF;
  font-style:normal;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
}
.brand-hero{text-align:center}
.logo-wrap{display:inline-flex;align-items:center;justify-content:center;min-height:44px}
.logo-wrap img{max-height:68px;width:auto;object-fit:contain;border-radius:10px;display:block}
.logo-wrap.nologo img{display:none}
.logo-fallback{
  display:none;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:32px;
  font-weight:600;
  letter-spacing:.26em;
  text-indent:.26em;
  text-transform:uppercase;
  color:var(--ink);
}
.logo-wrap.nologo .logo-fallback{display:block}
header p{
  margin-top:8px;
  font-size:12px;
  color:var(--mut);
  letter-spacing:.05em;
}

/* Search & Filter Pills */
.tools{padding:18px 0 6px}
.search{position:relative}
.search svg{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  stroke:var(--mut);
}
.search input{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px 14px 13px 42px;
  font-size:15px;
  outline:none;
  transition:border-color .2s;
}
.search input:focus{border-color:var(--gold)}
.search input::placeholder{color:#9A958C}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{
  padding:8px 15px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  font-size:12.5px;
  color:var(--mut);
  transition:.2s;
}
.pill.on{
  background:var(--ink);
  border-color:var(--ink);
  color:#FFFFFF;
  font-weight:600;
}

/* Section Headings */
.sec-hd{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin:28px 0 14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  scroll-margin-top:16px;
}
.sec-hd h2{font-size:18px;font-weight:600;letter-spacing:.01em}
.sec-hd span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Product Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
  cursor:pointer;
  transition:border-color .2s,transform .2s;
}
.card:hover{border-color:#CFC8B8}
.card .img{height:236px;padding:18px}
.img{
  height:276px;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#FFFFFF;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid #EFECE6;
}
.img img{
  width:auto;
  height:auto;
  max-width:82%;
  max-height:84%;
  object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(20,20,20,.11));
}
.img .ph{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:8px;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.img.noimg .ph{display:flex}
.img.noimg img{display:none}
.body{padding:18px}
.brand{
  font-size:11px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:700;
}
.title{font-size:23px;font-weight:600;line-height:1.2;margin-top:4px;color:var(--ink)}
.vibe{font-size:13px;color:var(--mut);margin-top:5px}
.fr{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--soft);
}
.fr small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.fr b{font-size:21px;font-weight:700;color:var(--ink)}
.vd{
  border:1px solid var(--ink);
  color:var(--ink);
  background:transparent;
  border-radius:10px;
  padding:10px 16px;
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.06em;
  transition:.2s;
}
.vd:hover{background:var(--ink);color:#FFFFFF}

/* Detail View */
.pr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.price{font-size:26px;font-weight:700;color:var(--ink)}
.badge{
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--gold);
  background:var(--gold-soft);
  color:var(--gold);
  font-size:12px;
  font-weight:600;
}
.lbl{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--mut);
  margin:20px 0 10px;
  font-weight:700;
  text-transform:uppercase;
}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 10px;
  text-align:center;
  background:var(--bg);
  transition:.2s;
}
.size b{display:block;font-size:13.5px;letter-spacing:.12em;font-weight:700}
.size span{display:block;font-size:15px;font-weight:600;margin-top:2px}
.size small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.size.on{border-color:var(--ink);background:var(--card);box-shadow:0 0 0 1px var(--ink)}
.size.on b{color:var(--gold)}
.row{display:flex;gap:10px;margin-top:18px}
.qty{
  display:flex;
  align-items:center;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  flex:none;
}
.qty button{width:40px;height:48px;font-size:20px;color:var(--ink)}
.qty span{min-width:26px;text-align:center;font-weight:700}
.add{
  flex:1;
  background:var(--ink);
  color:#FFFFFF;
  border-radius:12px;
  font-weight:700;
  letter-spacing:.12em;
  font-size:12.5px;
  height:50px;
  transition:.2s;
}
.add:hover{background:#2A2A2A}
.add.done{background:var(--gold);color:#FFFFFF}
.wa{
  width:100%;
  margin-top:10px;
  height:48px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  font-size:13.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.2s;
}
.wa:hover{border-color:var(--gold)}
.wa svg{width:18px;height:18px;fill:var(--gold)}
.trust{
  list-style:none;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
  display:grid;
